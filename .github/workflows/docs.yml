# Builds the documentation site (MkDocs Material) and publishes it on GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - "index.md"
      - "docs/**"
      - "tutorial/**/*.md"
      - "tutorial/img/**"
      - "mkdocs.yml"
      - "hooks/**"
      - "tools/docs_stage.py"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: python tools/docs_stage.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
